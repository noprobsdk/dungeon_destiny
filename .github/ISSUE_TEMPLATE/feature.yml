name: Feature Request
description: Track one Feature Request kept under delivery/.
title: "[FR-0000] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        This issue tracks a Feature Request. The Feature Request itself is kept in this repository under `delivery/<number>-feature-request-<name>/`, following `doc/howto-feature-request.md`. This issue is never the Feature Request source: do not record scope, acceptance criteria, or design decisions here.

  - type: input
    id: feature_request_number
    attributes:
      label: Feature Request number
      description: The four-digit number from the Feature Request folder.
      placeholder: "0001"
    validations:
      required: true

  - type: input
    id: feature_request_link
    attributes:
      label: Feature Request
      description: Link to the Feature Request README.md.
      placeholder: delivery/0001-feature-request-<name>/README.md
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences identifying the requested result. The Feature Request is authoritative.
    validations:
      required: true
